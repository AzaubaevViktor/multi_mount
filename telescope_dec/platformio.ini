; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = 
	teemuatlut/TMCStepper@^0.7.3
	paulstoffregen/AltSoftSerial@^1.4
monitor_speed = 115200
build_src_filter = +<*> -<wirescan.cpp>

; Standalone link scanner (src/wirescan.cpp). Deliberately shares nothing with the
; env above: no TMCStepper, no AltSoftSerial, no motor. That is what frees the RAM
; for a bit-banged UART on both pin orientations -- see the header of that file.
[env:wirescan]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<wirescan.cpp>
